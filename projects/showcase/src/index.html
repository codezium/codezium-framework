<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Codezium UI Showcase</title>
  <base href="/" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/x-icon" href="icons/favicon.ico" />
  <link rel="icon" type="image/png" href="icons/codezium-icon.png" />
  <link rel="apple-touch-icon" href="icons/codezium-icon.png" />
  <!-- Apply saved appearance before Angular boots (avoids dark-mode flash).
       The theme itself is scoped to the docs content area at runtime. -->
  <script>
    (function () {
      try {
        var dark = localStorage.getItem('cz-docs-dark');
        if (dark === null || dark === 'true') {
          document.documentElement.classList.add('dark');
        }
      } catch (e) { /* noop */ }
    })();
  </script>
</head>

<body>
  <app-root></app-root>

  <!-- PrismJS Core & Languages -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-typescript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-scss.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-bash.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-json.min.js"></script>
</body>

</html>
