<nav class="docs-toc" [attr.aria-label]="title()" role="navigation">
    @if (sections().length > 0) {
    <p class="docs-toc__title">{{ title() }}</p>

    <ul class="docs-toc__list" role="list">
        @for (section of sections(); track section.id) {
        <li class="docs-toc__item" [class.docs-toc__item--h2]="section.level === 2"
            [class.docs-toc__item--h3]="section.level === 3">
            <button class="docs-toc__link" czRipple [class.docs-toc__link--active]="activeId() === section.id"
                (click)="scrollTo(section.id)">
                {{ section.label }}
            </button>
        </li>
        }
    </ul>
    }
</nav>
