@if (visible()) {
    @if (modal()) {
        <div class="cz-dialog-mask" (click)="onMaskClick()"></div>
    }

    <div class="cz-dialog-wrapper" [attr.data-position]="position()">
        <div
            #dialogEl
            class="cz-dialog"
            role="dialog"
            aria-modal="true"
            tabindex="-1"
            [attr.aria-label]="header() || null"
            [style.width]="width()"
            [czFocusTrap]="true"
            [focusTrapAutoFocus]="false"
        >
            @if (header() || closable()) {
                <div class="cz-dialog-header">
                    <span class="cz-dialog-title">{{ header() }}</span>
                    @if (closable()) {
                        <button type="button" class="cz-dialog-close" aria-label="Close" (click)="close()">
                            &times;
                        </button>
                    }
                </div>
            }

            <div class="cz-dialog-content">
                <ng-content />
            </div>
        </div>
    </div>
}
