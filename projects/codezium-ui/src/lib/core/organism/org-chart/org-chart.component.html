<div class="cz-org-chart-container" [style.--cz-org-chart-gap]="gapStyle()">
    @if (value(); as root) {
        <ng-container [ngTemplateOutlet]="nodeTpl" [ngTemplateOutletContext]="{ $implicit: root }" />
    }
</div>

<ng-template #nodeTpl let-node>
    <div class="cz-org-chart-node-group">
        <div class="cz-org-chart-node-wrapper">
            <button type="button" class="cz-org-chart-node" (click)="onNodeSelect.emit(node)">
                @if (nodeTemplate(); as tpl) {
                    <ng-container [ngTemplateOutlet]="tpl" [ngTemplateOutletContext]="{ $implicit: node }" />
                } @else {
                    <span class="cz-org-chart-label">{{ node.label }}</span>
                }
            </button>

            @if (collapsible() && node.children?.length) {
                <button type="button" class="cz-org-chart-toggle" [attr.aria-expanded]="!isCollapsed(node)"
                    [attr.aria-label]="isCollapsed(node) ? 'Expand' : 'Collapse'" (click)="toggleNode(node, $event)">
                    <svg [lucideIcon]="isCollapsed(node) ? DownIcon : UpIcon" [size]="12"></svg>
                </button>
            }
        </div>

        @if (node.children?.length && !isCollapsed(node)) {
            <div class="cz-org-chart-children">
                @for (child of node.children; track child) {
                    <ng-container
                        [ngTemplateOutlet]="nodeTpl"
                        [ngTemplateOutletContext]="{ $implicit: child }"
                    />
                }
            </div>
        }
    </div>
</ng-template>
