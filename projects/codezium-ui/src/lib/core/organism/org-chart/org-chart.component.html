<div class="cz-org-chart-container">
    @if (value(); as root) {
        <ng-container [ngTemplateOutlet]="nodeTpl" [ngTemplateOutletContext]="{ $implicit: root }" />
    }
</div>

<ng-template #nodeTpl let-node>
    <div class="cz-org-chart-node-group">
        <button type="button" class="cz-org-chart-node" (click)="onNodeSelect.emit(node)">
            <span class="cz-org-chart-label">{{ node.label }}</span>
        </button>

        @if (node.children?.length) {
            <div class="cz-org-chart-children">
                @for (child of node.children; track child) {
                    <ng-container
                        [ngTemplateOutlet]="nodeTpl"
                        [ngTemplateOutletContext]="{ $implicit: child }"
                    />
                }
            </div>
        }
    </div>
</ng-template>
