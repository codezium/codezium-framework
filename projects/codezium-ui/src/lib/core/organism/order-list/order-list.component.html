<div class="cz-order-list-container">
    <ul class="cz-order-list-items" role="listbox" [attr.aria-label]="ariaLabel()">
        @for (item of items(); track $index; let i = $index) {
            <li
                class="cz-order-list-item"
                role="option"
                [attr.aria-selected]="i === selectedIndex()"
                [class.cz-order-list-item--selected]="i === selectedIndex()"
                (click)="select(i)"
            >
                {{ display(item) }}
            </li>
        } @empty {
            <li class="cz-order-list-empty">No items</li>
        }
    </ul>

    <div class="cz-order-list-controls">
        <button
            type="button"
            class="cz-order-list-btn"
            aria-label="Move up"
            [disabled]="!canMoveUp()"
            (click)="moveUp()"
        >
            <svg [lucideIcon]="UpIcon" [size]="16"></svg>
        </button>
        <button
            type="button"
            class="cz-order-list-btn"
            aria-label="Move down"
            [disabled]="!canMoveDown()"
            (click)="moveDown()"
        >
            <svg [lucideIcon]="DownIcon" [size]="16"></svg>
        </button>
    </div>
</div>
