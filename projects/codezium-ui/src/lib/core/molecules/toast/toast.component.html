<div class="cz-toast-stack" aria-live="polite" aria-atomic="false">
    @for (message of messages(); track message.id) {
        <div class="cz-toast-item" role="status" [attr.data-severity]="message.severity">
            <svg [lucideIcon]="iconFor(message)" [size]="18" class="cz-toast-icon"></svg>

            <div class="cz-toast-body">
                @if (message.summary) {
                    <div class="cz-toast-summary">{{ message.summary }}</div>
                }
                @if (message.detail) {
                    <div class="cz-toast-detail">{{ message.detail }}</div>
                }
            </div>

            <button
                type="button"
                class="cz-toast-close"
                aria-label="Close"
                (click)="close(message.id)"
            >
                &times;
            </button>
        </div>
    }
</div>
