<div class="cz-select-button-wrapper" [class.cz-select-button-wrapper--fluid]="fluid()">
    @if (label()) {
        <label class="cz-select-button-label-group" [attr.id]="groupLabelId">{{ label() }}</label>
    }

    <div
        class="cz-select-button-container"
        role="group"
        [ngClass]="styleClass()"
        [attr.aria-labelledby]="effectiveAriaLabelledBy()"
    >
        @for (option of options(); track $index; let i = $index) {
            <button
                #optionButton
                type="button"
                class="cz-select-button-option"
                [class.cz-select-button-option--active]="isSelected(option)"
                [disabled]="isButtonDisabled(option)"
                (click)="onOptionClick($event, option, i)"
                (keydown)="onKeyDown($event, option, i)"
                [attr.aria-pressed]="isSelected(option)"
                [attr.aria-label]="getLabel(option)"
                [attr.aria-disabled]="isButtonDisabled(option) ? 'true' : null"
                [attr.tabindex]="actualDisabled() ? -1 : (focusedIndex() === i || (focusedIndex() === -1 && i === 0) ? tabindex() : -1)"
            >
                @if (itemTemplate()) {
                    <ng-container
                        [ngTemplateOutlet]="itemTemplate()!"
                        [ngTemplateOutletContext]="{ $implicit: option, index: i }"
                    />
                } @else {
                    <span class="cz-select-button-option-label">
                        {{ getLabel(option) }}
                    </span>
                }
            </button>
        }
    </div>

    <div class="cz-select-button-messages">
        @if (showErrors() && isInvalid && errorMessage) {
            <small class="cz-select-button-error">{{ errorMessage }}</small>
        }
        @if (helperText()) {
            <div class="cz-select-button-helper">
                {{ helperText() }}
            </div>
        }
    </div>
</div>
